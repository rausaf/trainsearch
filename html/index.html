<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Train Search App in Where Users Can search Train Information And Timings By Entering A Crs Code, Users Can Also Click A Submit Button To Submit">
    <title>Sprinter Dmu, The Ultimate Crs Code Train Search Web App</title>
    <link rel="canonical" href="https://sprinter-dmu.vercel.app/" />

    <style>
        input {
            border-radius: 50px;
            height: 50px;
        }

        label {
            font-size: xx-large;
            font-weight: 1000;
        }

        button {
            border-radius: 50px;
            height: 50px;
            width: 100px;
        }

        #reload {
            color: white;
            background-color: black;
            height: 50px;
        }

        #submit {
            color: white;
            background-color: green;
        }
    </style>

    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>

</head>

<body>
    <main>
        <h1>Number Of Visitors:</h1>

        <div id="sfcur2g2d2y52l98z8af8y78ucg6fuk5ksc"></div>
        <a href="https://www.freecounterstat.com" title="website counters"><img
                src="https://counter6.optistats.ovh/private/freecounterstat.php?c=lprkjf5ctjnr9sqj7yypbs227m6cdqsl"
                border="0" title="website counters" alt="website counters"></a>
        <h2>Train Search App</h2>
        <h2>Enter A CRS Code(eg. PAD for london paddington and KGX for london kings cross) And Submit To See Information
            About The Trains eg. Train Type</h2>
        <h2>To Learn More About CRS Codes Go To: <a
                href="https://www.railwaycodes.org.uk/crs/crs0.shtm">www.railwaycodes.org.uk</a>
        </h2>
        <div id="center">
            <h3>To Clear The Results Click The Clear Button</h3>
            <form>
                <label for="input">Search Trains</label>
                <input type="text" value="" id="input" name="input">

                <button type="submit" id="submit">submit</button><button onClick="window.location.reload();"
                    id="reload">Clear</button>
            </form>
            <h2 id="error"></h2>
            <ul id="ul"></ul>
        </div>
    </main>
    <script>
        const error = document.getElementById("error"),
            crs = document.getElementById("input");
        document.querySelector("form").addEventListener("submit", (e) => {
            e.preventDefault(),
                fetch(`https://railfeed.co.uk/data/passthrough_board?crs=${crs.value}`)
                    .then((e) => e.json())
                    .then((e) => {
                        e.services.forEach((e) => {
                            const t = `<li><h2>${e.toc_name
                                }</h2> <h2>${e.toc_type.toLowerCase()}</h2> <h2>Train</h2> <h2>Departing From: </h2><h2>${e.origin
                                }</h2> <h2>And Arriving At: </h2><h2>${e.destination
                                }</h2> <h2>Departed At: </h2><h2>${e.origin_departure}</h2></li>`;
                            document.querySelector("ul").insertAdjacentHTML("beforeend", t);
                        });
                    })
                    .catch((e) => (document.getElementById("error").innerHTML = "Not Found"));
        });
    </script>
</body>

</html>
